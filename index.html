<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AUTOPIR" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <title>AUTOPIR</title>
    <meta name="description" content="Preparación del PIR con 2.102 preguntas reales de exámenes oficiales: autoevaluaciones por examen y por tema, flashcards con repetición espaciada y duelos 1v1." />

    <!-- Tarjeta del enlace al compartirlo (WhatsApp, Telegram, iMessage…). Sin
         esto el enlace de invitación `?c=CODIGO` llega pelado y no dice ni qué
         es. Los rastreadores NO ejecutan JavaScript, así que esto tiene que
         estar en el HTML servido y las URLs han de ser absolutas: una ruta
         relativa en og:image la ignoran casi todos. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUTOPIR" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="AUTOPIR · Preparación PIR" />
    <meta property="og:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones por examen y por tema, flashcards y duelos 1v1." />
    <meta property="og:url" content="https://academia-mocha.vercel.app/" />
    <meta property="og:image" content="https://academia-mocha.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="AUTOPIR · preparación PIR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AUTOPIR · Preparación PIR" />
    <meta name="twitter:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones, flashcards y duelos 1v1." />
    <meta name="twitter:image" content="https://academia-mocha.vercel.app/og.png" />
    <style>
      /* COLORES. Todos los colores de la app son variables: los estilos en
         línea de App.jsx dicen "var(--tinta)", no "#17171B", así que el modo
         noche no tapa colores sueltos a base de parches — cambia la paleta
         entera y cada pantalla la hereda. Lo activa React poniendo
         data-tema="oscuro" en <html> (Ajustes -> Apariencia). */
      :root {
        --fondo: #FFFFFF; --superficie: #FFFFFF; --bloque: #F3F2EF;
        --tinta: #17171B; --negro: #0C0C0D; --humo: #6A6A72; --niebla: #A2A2AB; --linea: #E4E3E0;
        --sobre-negro: #FFFFFF;
        --acento: #A6362B; --acento-suave: #F7E9E6; --correcto: #2E7D46; --correcto-suave: #E7F1E9;
        --oro: #93711F; --aviso: #9C5A1F; --aviso-suave: #FBEEE0; --cautela: #8A6D1F; --cautela-suave: #FBF3DE;
        --mal: #9E2B20; --mal-suave: #FBEFED; --bien: #1B6B4F; --bien-suave: #ECF5F1;
        --velo: rgba(255,255,255,0.93); --velo-claro: rgba(255,255,255,0.85); --velo-vacio: rgba(255,255,255,0.5); --velo-sel: rgba(12,12,13,0.8);
        --velo-foto: rgba(0,0,0,0); --pestana-hover: #F3F2EF; --pestana-activa: #E3E2DD;
        --velo-encima: rgba(226,225,220,0.94);
      }
      html[data-tema="oscuro"] {
        color-scheme: dark;
        --fondo: #111113; --superficie: #1B1B1E; --bloque: #232327;
        --tinta: #ECECEE; --negro: #F4F4F5; --humo: #A3A3AB; --niebla: #74747C; --linea: #303036;
        --sobre-negro: #111113;
        --acento: #CF5F52; --acento-suave: #3A211E; --correcto: #4FB27A; --correcto-suave: #18291F;
        --oro: #D6B25E; --aviso: #DB975F; --aviso-suave: #33261A; --cautela: #D3BA5E; --cautela-suave: #302A17;
        --mal: #D4675A; --mal-suave: #38201D; --bien: #43A97D; --bien-suave: #162B23;
        --velo: rgba(27,27,30,0.9); --velo-claro: rgba(27,27,30,0.84); --velo-vacio: rgba(27,27,30,0.55); --velo-sel: rgba(244,244,245,0.94);
        --velo-foto: rgba(8,8,10,0.55); --pestana-hover: #222226; --pestana-activa: #34343A;
        --velo-encima: rgba(58,58,64,0.94);
        background: #111113;
      }
      html[data-tema="oscuro"] body { background: #111113; }
      /* Los iconos de lucide reciben el color como ATRIBUTO (stroke="#…"),
         y ahí una variable CSS no funciona; estos pocos se cambian a mano. */
      html[data-tema="oscuro"] svg[stroke="#17171B"], html[data-tema="oscuro"] svg[stroke="#0C0C0D"] { stroke: #ECECEE; }
      html[data-tema="oscuro"] svg[stroke="#6A6A72"] { stroke: #A3A3AB; }
      html[data-tema="oscuro"] svg[stroke="#A2A2AB"], html[data-tema="oscuro"] svg[stroke="#C7C2B4"] { stroke: #74747C; }
      html[data-tema="oscuro"] img { filter: none; }


      /* Pantalla de carga: AUTOPIR sube letra a letra (AUTO gordo, PIR fino,
         como el logo) y debajo una raya fina que barre. Es la MISMA en el
         HTML (antes de que llegue el JavaScript) y en React (mientras cargan
         los datos). */
      .carga { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--fondo); }
      .carga-marca { display: flex; align-items: baseline; font-family: 'Cabinet Grotesk', 'Arial Black', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.1em; color: var(--negro); padding-left: 0.1em; }
      .carga-marca .fina { font-family: 'Switzer', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .carga-marca span { display: inline-block; opacity: 0; transform: translateY(10px); animation: cargaLetra 0.55s cubic-bezier(.22,1,.36,1) forwards; }
      .carga-via { position: relative; width: 120px; height: 1.5px; background: var(--linea); overflow: hidden; opacity: 0; animation: cargaAparece 0.4s ease 0.55s forwards; }
      .carga-via i { position: absolute; top: 0; bottom: 0; width: 38%; background: var(--negro); animation: cargaBarre 1.15s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes cargaLetra { to { opacity: 1; transform: none; } }
      @keyframes cargaAparece { to { opacity: 1; } }
      @keyframes cargaBarre { 0% { left: -38%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .carga-marca span, .carga-via { animation: none; opacity: 1; transform: none; }
        .carga-via i { animation: none; left: 31%; }
      }

      /* Pestañas: una raya vertical fina entre una y otra, que no llega a
         la línea de abajo. Se esconde junto a la abierta y junto a la que
         tiene el ratón encima, para que el bloque sombreado no quede
         cortado por una raya. */
      .nav-app button + button::before { content: ""; position: absolute; left: -3.5px; top: 28%; bottom: 28%; width: 1px; background: var(--linea); transition: opacity .15s; }
      .nav-app button.activa::before, .nav-app button.activa + button::before { opacity: 0; }
      .nav-app button.encima::before, .nav-app button.encima + button::before { opacity: 0; }
      /* El número de preguntas vacío enseña la cantidad en gris. */
      .campo-cantidad::placeholder { color: var(--niebla); opacity: 1; }
      .campo-cantidad:focus { outline: none; box-shadow: inset 0 -2px 0 var(--negro) !important; }

      /* Que el gesto de dos dedos del trackpad (o el borde de la pantalla)
         no lo coja el navegador para ir atrás: es de la app, para pasar de
         página. */
      html, body { overscroll-behavior-x: none; }
      /* Sin esto el navegador le pone 8 px de margen al body: un marco blanco
         alrededor de la portada (la foto no llegaba a los bordes) y una
         página 16 px más alta que la pantalla, que por eso "se movía". */
      html, body { margin: 0; }
      /* La app lleva user-select: none para que tocar no seleccione texto, y
         los campos lo heredaban: Safari puede negarse a llevar el foco (o el
         tabulador) a un campo así. Los campos sí se escriben y se seleccionan. */
      input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
      /* Mientras se ve la portada no hay rebote: es una pantalla fija, no una
         página que se desplace. */
      html.sin-rebote, html.sin-rebote body { overscroll-behavior: none; }


      /* Tipografía del rediseño, autoalojada (Fontshare, licencia libre). */
      @font-face { font-family: 'Cabinet Grotesk'; src: url('/fonts/cabinet-grotesk-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      @font-face { font-family: 'Cabinet Grotesk'; src: url('/fonts/cabinet-grotesk-800.woff2') format('woff2'); font-weight: 800; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }

      /* Clase de utilidad usada en varios sitios del árbol (Loader2 en el
         login, en "Generar" preguntas IA, en la carga inicial, y en
         "Esperando a un oponente..." del Duelo) — sin este keyframe global
         la clase no hacía nada, así que los iconos de carga se quedaban
         parados en vez de girar. */
      @keyframes animateSpin { to { transform: rotate(360deg); } }
      .animate-spin { animation: animateSpin 1s linear infinite; }

      /* La app se escribe con estilos en línea, así que aquí van las únicas
         reglas que dependen del ancho de la pantalla — y por eso llevan
         !important: un estilo en línea gana a una hoja de estilos.

         El problema que resuelven: en la cabecera caben la marca, hasta tres
         píldoras, el nombre y siete botones. En un iPad entra de sobra; en un
         móvil eso mide unos 530 px dentro de una caja de 374, la página
         entera se ensancha, y el engranaje de Ajustes y el botón de salir se
         quedan literalmente fuera de la pantalla. */
      @media (max-width: 620px) {
        /* `env(safe-area-inset-top)` reserva la franja del reloj y la batería.
           Desde el icono de la pantalla de inicio la página empieza en y=0 y
           iOS dibuja la hora ENCIMA, así que la primera fila de la cabecera
           —la marca y las píldoras de gente en línea— quedaba tapada. Es el
           mismo fallo que ya tuvo la barra de aviso con su X.
           En Safari normal la variable vale 0 y `max()` deja los 12 px de
           siempre, así que fuera del icono no cambia nada. */
        .cabecera { padding: max(12px, env(safe-area-inset-top)) 8px 2px 14px !important; flex-wrap: nowrap !important; position: relative !important; }
        /* Ya sabes cómo te llamas, y son los ~110 px que hacen falta para
           que quepan los botones, que son lo que sí hace algo. */
        .cabecera-nombre { display: none !important; }
        .cabecera-marca { gap: 6px !important; }
        .cabecera-iconos { gap: 0 !important; flex-shrink: 0; }
        .cabecera-iconos button { padding: 6px 5px !important; }
        .cabecera-marca { min-width: 0; flex-wrap: wrap; row-gap: 4px; }
        .nav-app { padding-left: 8px !important; padding-right: 8px !important; gap: 4px !important; }
        .nav-app button { padding: 9px 1px !important; font-size: clamp(9.5px, 2.8vw, 11.5px) !important; letter-spacing: 0 !important; text-transform: none !important; gap: 6px !important; border-radius: 8px !important; min-width: 0; }
        .nav-app button + button::before { left: -2.5px; }
        /* Las cuatro pestañas con su icono no caben, y la que se queda fuera
           ("Mi perfil") no se ve que esté ahí: la barra se desplaza pero no
           lo parece. Sin los iconos entran las cuatro y ya no hay nada
           escondido; el texto solo se lee igual de bien. */
        .nav-app button svg { display: none !important; }
        .main-app { padding: 20px 14px 48px !important; }

        /* Los iconos van en la MISMA fila que la marca, pequeños y a la
           derecha. El desplegable de la frase colgaba de SU botón con
           `right: 0`; en un móvil un panel de 320 px se saldría por la
           izquierda, así que se le quita el anclaje al botón (los
           envoltorios pasan a `static`) y se cuelga de la cabecera entera
           (`position: relative` arriba), de borde a borde. */
        .cabecera-iconos, .cabecera-iconos > div { position: static !important; }
        .desplegable { left: 0 !important; right: 0 !important; width: auto !important; max-width: none !important; }
      }
    </style>

    <script>
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem("pir-ajustes") || "{}");
          var t = a.tema || "sistema";
          var oscuro = t === "oscuro" || (t === "sistema" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-tema", oscuro ? "oscuro" : "claro");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="arranque" class="carga">
        <div class="carga-marca" aria-label="AUTOPIR"><span style="animation-delay:0ms">A</span><span style="animation-delay:70ms">U</span><span style="animation-delay:140ms">T</span><span style="animation-delay:210ms">O</span><span class="fina" style="animation-delay:280ms">P</span><span class="fina" style="animation-delay:350ms">I</span><span class="fina" style="animation-delay:420ms">R</span></div>
        <div class="carga-via"><i></i></div>
      </div>
    </div>
    <script>
      /* Red de seguridad para la pantalla en blanco.

         El icono de la pantalla de inicio guarda su propia copia de esta
         página. Tras un despliegue, el fichero de JavaScript cambia de
         nombre, así que esa copia apunta a algo que ya no existe: la app no
         arranca y no se ve absolutamente nada, ni un error. Pasó de verdad y
         costó una tarde averiguarlo.

         Si a los 8 segundos React no ha montado, se fuerza UNA recarga con
         un parámetro nuevo (que se salta la copia guardada). Si tras esa
         recarga sigue sin arrancar, se deja un aviso escrito en vez de una
         pantalla vacía. */
      window.__autopirArranco = false;
      setTimeout(function () {
        if (window.__autopirArranco) return;
        var caja = document.getElementById("arranque");
        if (!caja) return;
        var yaRecargado;
        try { yaRecargado = sessionStorage.getItem("autopir-recarga"); } catch (e) { yaRecargado = "1"; }
        if (!yaRecargado) {
          try { sessionStorage.setItem("autopir-recarga", "1"); } catch (e) {}
          var sep = window.location.search ? "&" : "?";
          window.location.replace(window.location.href + sep + "_r=" + Date.now());
          return;
        }
        caja.innerHTML =
          "<strong style='color:#1E1C18;font-size:17px'>No se pudo cargar la aplicación</strong>" +
          "<br><br>Si la abriste desde el icono de la pantalla de inicio, bórralo y vuelve a añadirlo desde Safari." +
          "<br><br>Si no, prueba a recargar dentro de un rato.";
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
