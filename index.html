<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AUTOPIR" />
    <meta name="theme-color" content="#1D4A3C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>AUTOPIR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,470;0,9..144,600;1,9..144,470;1,9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,470;0,8..60,600;1,8..60,470&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap"
    />
    <style>
      /* Clase de utilidad usada en varios sitios del árbol (Loader2 en el
         login, en "Generar" preguntas IA, en la carga inicial, y en
         "Esperando a un oponente..." del Duelo) — sin este keyframe global
         la clase no hacía nada, así que los iconos de carga se quedaban
         parados en vez de girar. */
      @keyframes animateSpin { to { transform: rotate(360deg); } }
      .animate-spin { animation: animateSpin 1s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="arranque" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #6E6A61; padding: 48px 24px; text-align: center; font-size: 15px; line-height: 1.6;">
        Cargando AUTOPIR…
      </div>
    </div>
    <script>
      /* Red de seguridad para la pantalla en blanco.

         El icono de la pantalla de inicio guarda su propia copia de esta
         página. Tras un despliegue, el fichero de JavaScript cambia de
         nombre, así que esa copia apunta a algo que ya no existe: la app no
         arranca y no se ve absolutamente nada, ni un error. Pasó de verdad y
         costó una tarde averiguarlo.

         Si a los 8 segundos React no ha montado, se fuerza UNA recarga con
         un parámetro nuevo (que se salta la copia guardada). Si tras esa
         recarga sigue sin arrancar, se deja un aviso escrito en vez de una
         pantalla vacía. */
      window.__autopirArranco = false;
      setTimeout(function () {
        if (window.__autopirArranco) return;
        var caja = document.getElementById("arranque");
        if (!caja) return;
        var yaRecargado;
        try { yaRecargado = sessionStorage.getItem("autopir-recarga"); } catch (e) { yaRecargado = "1"; }
        if (!yaRecargado) {
          try { sessionStorage.setItem("autopir-recarga", "1"); } catch (e) {}
          var sep = window.location.search ? "&" : "?";
          window.location.replace(window.location.href + sep + "_r=" + Date.now());
          return;
        }
        caja.innerHTML =
          "<strong style='color:#1E1C18;font-size:17px'>No se pudo cargar la aplicación</strong>" +
          "<br><br>Si la abriste desde el icono de la pantalla de inicio, bórralo y vuelve a añadirlo desde Safari." +
          "<br><br>Si no, prueba a recargar dentro de un rato.";
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
