<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AUTOPIR" />
    <meta name="theme-color" content="#1D4A3C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>AUTOPIR</title>
    <meta name="description" content="Preparación del PIR con 2.102 preguntas reales de exámenes oficiales: autoevaluaciones por examen y por tema, flashcards con repetición espaciada y duelos 1v1." />

    <!-- Tarjeta del enlace al compartirlo (WhatsApp, Telegram, iMessage…). Sin
         esto el enlace de invitación `?c=CODIGO` llega pelado y no dice ni qué
         es. Los rastreadores NO ejecutan JavaScript, así que esto tiene que
         estar en el HTML servido y las URLs han de ser absolutas: una ruta
         relativa en og:image la ignoran casi todos. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUTOPIR" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="AUTOPIR · Preparación PIR" />
    <meta property="og:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones por examen y por tema, flashcards y duelos 1v1." />
    <meta property="og:url" content="https://academia-mocha.vercel.app/" />
    <meta property="og:image" content="https://academia-mocha.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="AUTOPIR · preparación PIR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AUTOPIR · Preparación PIR" />
    <meta name="twitter:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones, flashcards y duelos 1v1." />
    <meta name="twitter:image" content="https://academia-mocha.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,470;0,9..144,600;1,9..144,470;1,9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,470;0,8..60,600;1,8..60,470&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap"
    />
    <style>
      /* Clase de utilidad usada en varios sitios del árbol (Loader2 en el
         login, en "Generar" preguntas IA, en la carga inicial, y en
         "Esperando a un oponente..." del Duelo) — sin este keyframe global
         la clase no hacía nada, así que los iconos de carga se quedaban
         parados en vez de girar. */
      @keyframes animateSpin { to { transform: rotate(360deg); } }
      .animate-spin { animation: animateSpin 1s linear infinite; }

      /* La app se escribe con estilos en línea, así que aquí van las únicas
         reglas que dependen del ancho de la pantalla — y por eso llevan
         !important: un estilo en línea gana a una hoja de estilos.

         El problema que resuelven: en la cabecera caben la marca, hasta tres
         píldoras, el nombre y siete botones. En un iPad entra de sobra; en un
         móvil eso mide unos 530 px dentro de una caja de 374, la página
         entera se ensancha, y el engranaje de Ajustes y el botón de salir se
         quedan literalmente fuera de la pantalla. */
      @media (max-width: 620px) {
        .cabecera { padding: 12px 14px !important; }
        /* Ya sabes cómo te llamas, y son los ~110 px que hacen falta para
           que quepan los botones, que son lo que sí hace algo. */
        .cabecera-nombre { display: none !important; }
        .cabecera-marca { gap: 6px !important; }
        .cabecera-iconos { gap: 2px !important; }
        .nav-app { padding: 0 6px !important; }
        .nav-app button { padding: 13px 5px !important; font-size: 13.5px !important; gap: 6px !important; }
        /* Las cuatro pestañas con su icono no caben, y la que se queda fuera
           ("Mi perfil") no se ve que esté ahí: la barra se desplaza pero no
           lo parece. Sin los iconos entran las cuatro y ya no hay nada
           escondido; el texto solo se lee igual de bien. */
        .nav-app button svg { display: none !important; }
        .main-app { padding: 20px 14px 46px !important; }

        /* Los desplegables (Logros, Ruleta, Frase) van anclados con
           `right: 0` a SU botón. En una pantalla ancha el botón está a la
           derecha y el panel cae hacia dentro; en un móvil los botones se
           han bajado a una segunda fila pegados a la izquierda, así que un
           panel de 320 px colgado de su borde derecho se sale medio metro
           por fuera de la pantalla.

           En vez de inventar un `top` a ojo, se le quita el anclaje al
           botón (los envoltorios pasan a `static`) y el panel se cuelga de
           la fila de iconos entera, de borde a borde. */
        /* Ancho completo: además de dejar los iconos repartidos, es lo que
           da al panel colgado de esta fila el ancho de la pantalla en vez
           del de los siete botones. */
        .cabecera-iconos { position: relative !important; width: 100% !important; justify-content: space-between !important; }
        .cabecera-iconos > div { position: static !important; }
        .desplegable { left: 0 !important; right: 0 !important; width: auto !important; max-width: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="arranque" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #6E6A61; padding: 48px 24px; text-align: center; font-size: 15px; line-height: 1.6;">
        Cargando AUTOPIR…
      </div>
    </div>
    <script>
      /* Red de seguridad para la pantalla en blanco.

         El icono de la pantalla de inicio guarda su propia copia de esta
         página. Tras un despliegue, el fichero de JavaScript cambia de
         nombre, así que esa copia apunta a algo que ya no existe: la app no
         arranca y no se ve absolutamente nada, ni un error. Pasó de verdad y
         costó una tarde averiguarlo.

         Si a los 8 segundos React no ha montado, se fuerza UNA recarga con
         un parámetro nuevo (que se salta la copia guardada). Si tras esa
         recarga sigue sin arrancar, se deja un aviso escrito en vez de una
         pantalla vacía. */
      window.__autopirArranco = false;
      setTimeout(function () {
        if (window.__autopirArranco) return;
        var caja = document.getElementById("arranque");
        if (!caja) return;
        var yaRecargado;
        try { yaRecargado = sessionStorage.getItem("autopir-recarga"); } catch (e) { yaRecargado = "1"; }
        if (!yaRecargado) {
          try { sessionStorage.setItem("autopir-recarga", "1"); } catch (e) {}
          var sep = window.location.search ? "&" : "?";
          window.location.replace(window.location.href + sep + "_r=" + Date.now());
          return;
        }
        caja.innerHTML =
          "<strong style='color:#1E1C18;font-size:17px'>No se pudo cargar la aplicación</strong>" +
          "<br><br>Si la abriste desde el icono de la pantalla de inicio, bórralo y vuelve a añadirlo desde Safari." +
          "<br><br>Si no, prueba a recargar dentro de un rato.";
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
