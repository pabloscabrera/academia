<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>AUTOPIR</title>
    <meta name="description" content="Preparación del PIR con 2.102 preguntas reales de exámenes oficiales: autoevaluaciones por examen y por tema, flashcards con repetición espaciada y duelos 1v1." />

    <!-- Tarjeta del enlace al compartirlo (WhatsApp, Telegram, iMessage…). Sin
         esto el enlace de invitación `?c=CODIGO` llega pelado y no dice ni qué
         es. Los rastreadores NO ejecutan JavaScript, así que esto tiene que
         estar en el HTML servido y las URLs han de ser absolutas: una ruta
         relativa en og:image la ignoran casi todos. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUTOPIR" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="AUTOPIR · Preparación PIR" />
    <meta property="og:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones por examen y por tema, flashcards y duelos 1v1." />
    <meta property="og:url" content="https://academia-mocha.vercel.app/" />
    <meta property="og:image" content="https://academia-mocha.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="AUTOPIR · preparación PIR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AUTOPIR · Preparación PIR" />
    <meta name="twitter:description" content="2.102 preguntas reales de exámenes oficiales, autoevaluaciones, flashcards y duelos 1v1." />
    <meta name="twitter:image" content="https://academia-mocha.vercel.app/og.png" />
    <style>
      /* MODO NOCHE. La app se pinta con estilos en línea, así que el tema
         oscuro cambia los colores del rediseño allí donde aparecen escritos.
         Lo activa React poniendo data-tema="oscuro" en <html> (Ajustes ->
         Apariencia: Claro, Oscuro o Automático, que sigue al móvil). */
      html[data-tema="oscuro"] { color-scheme: dark; background: #141416; }
      html[data-tema="oscuro"] body { background: #141416; }
      html[data-tema="oscuro"] [style*="background: rgb(255, 255, 255)"], html[data-tema="oscuro"] [style*="background-color: rgb(255, 255, 255)"] { background-color: #141416 !important; }
      html[data-tema="oscuro"] [style*="background: rgb(247, 246, 243)"], html[data-tema="oscuro"] [style*="background-color: rgb(247, 246, 243)"] { background-color: #1C1C1F !important; }
      html[data-tema="oscuro"] [style*="background: rgb(242, 241, 238)"], html[data-tema="oscuro"] [style*="background-color: rgb(242, 241, 238)"] { background-color: #222226 !important; }
      html[data-tema="oscuro"] [style*="background: rgb(239, 237, 232)"], html[data-tema="oscuro"] [style*="background-color: rgb(239, 237, 232)"] { background-color: #2A2A2F !important; }
      html[data-tema="oscuro"] [style*="background: rgb(228, 227, 224)"], html[data-tema="oscuro"] [style*="background-color: rgb(228, 227, 224)"] { background-color: #2E2E33 !important; }
      html[data-tema="oscuro"] [style*="background-color: rgba(255, 255, 255, 0.93)"] { background-color: rgba(26, 26, 30, 0.92) !important; }
      html[data-tema="oscuro"] [style*="background: rgba(255, 255, 255, 0.85)"], html[data-tema="oscuro"] [style*="background-color: rgba(255, 255, 255, 0.85)"] { background-color: rgba(26, 26, 30, 0.86) !important; }
      html[data-tema="oscuro"] [style*="background: rgb(12, 12, 13)"], html[data-tema="oscuro"] [style*="background-color: rgb(12, 12, 13)"] { background-color: #F2F2F3 !important; color: #0C0C0D !important; }
      html[data-tema="oscuro"] [style^="color: rgb(23, 23, 27)"], html[data-tema="oscuro"] [style*=" color: rgb(23, 23, 27)"] { color: #ECECEE !important; }
      html[data-tema="oscuro"] [style^="color: rgb(12, 12, 13)"], html[data-tema="oscuro"] [style*=" color: rgb(12, 12, 13)"] { color: #F2F2F3 !important; }
      html[data-tema="oscuro"] [style^="color: rgb(106, 106, 114)"], html[data-tema="oscuro"] [style*=" color: rgb(106, 106, 114)"] { color: #A6A6AE !important; }
      html[data-tema="oscuro"] [style^="color: rgb(162, 162, 171)"], html[data-tema="oscuro"] [style*=" color: rgb(162, 162, 171)"] { color: #7C7C84 !important; }
      html[data-tema="oscuro"] [style^="color: rgb(58, 58, 67)"], html[data-tema="oscuro"] [style*=" color: rgb(58, 58, 67)"] { color: #C9C9D0 !important; }
      html[data-tema="oscuro"] [style*="solid rgb(228, 227, 224)"] { border-color: #2E2E33 !important; }
      html[data-tema="oscuro"] [style*="solid rgb(12, 12, 13)"] { border-color: #F2F2F3 !important; }
      html[data-tema="oscuro"] [style*="box-shadow: rgb(12, 12, 13)"] { box-shadow: inset 0 -1.5px 0 #F2F2F3 !important; }
      html[data-tema="oscuro"] input, html[data-tema="oscuro"] select, html[data-tema="oscuro"] textarea { background-color: #1C1C1F !important; color: #ECECEE !important; }
      html[data-tema="oscuro"] svg circle[stroke="#0C0C0D"] { stroke: #F2F2F3; }
      html[data-tema="oscuro"] svg text[fill="#0C0C0D"] { fill: #F2F2F3; }
      html[data-tema="oscuro"] svg circle[stroke="#E4E3E0"] { stroke: #2E2E33; }
      html[data-tema="oscuro"] svg[stroke="#17171B"], html[data-tema="oscuro"] svg[stroke="#0C0C0D"] { stroke: #ECECEE; }
      html[data-tema="oscuro"] svg[stroke="#6A6A72"] { stroke: #A6A6AE; }
      html[data-tema="oscuro"] svg[stroke="#A2A2AB"] { stroke: #7C7C84; }
      html[data-tema="oscuro"] .carga { background: #141416; }
      html[data-tema="oscuro"] .carga-marca { color: #F2F2F3; }
      html[data-tema="oscuro"] .carga-via { background: #2E2E33; }
      html[data-tema="oscuro"] .carga-via i { background: #F2F2F3; }

      /* Pantalla de carga del rediseño: AUTOPIR sube letra a letra y una raya
         barre debajo, como la del duelo. Es la MISMA en el HTML (antes de que
         llegue el JavaScript) y en React (mientras cargan los datos), así que
         no hay salto de una a otra. */
      .carga { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; }
      .carga-marca { display: flex; font-family: 'Cabinet Grotesk', 'Arial Black', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.22em; color: #0C0C0D; padding-left: 0.22em; }
      .carga-marca span { display: inline-block; opacity: 0; transform: translateY(10px); animation: cargaLetra 0.55s cubic-bezier(.22,1,.36,1) forwards; }
      .carga-via { position: relative; width: 132px; height: 2px; background: #E4E3E0; overflow: hidden; opacity: 0; animation: cargaAparece 0.4s ease 0.55s forwards; }
      .carga-via i { position: absolute; top: 0; bottom: 0; width: 38%; background: #0C0C0D; animation: cargaBarre 1.15s cubic-bezier(.65,0,.35,1) infinite; }
      .carga-dice { font-family: 'Switzer', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #A2A2AB; opacity: 0; animation: cargaAparece 0.4s ease 0.75s forwards; }
      @keyframes cargaLetra { to { opacity: 1; transform: none; } }
      @keyframes cargaAparece { to { opacity: 1; } }
      @keyframes cargaBarre { 0% { left: -38%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .carga-marca span, .carga-via, .carga-dice { animation: none; opacity: 1; transform: none; }
        .carga-via i { animation: none; left: 31%; }
      }

      /* Tipografía del rediseño, autoalojada (Fontshare, licencia libre). */
      @font-face { font-family: 'Cabinet Grotesk'; src: url('/fonts/cabinet-grotesk-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      @font-face { font-family: 'Cabinet Grotesk'; src: url('/fonts/cabinet-grotesk-800.woff2') format('woff2'); font-weight: 800; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }

      /* Clase de utilidad usada en varios sitios del árbol (Loader2 en el
         login, en "Generar" preguntas IA, en la carga inicial, y en
         "Esperando a un oponente..." del Duelo) — sin este keyframe global
         la clase no hacía nada, así que los iconos de carga se quedaban
         parados en vez de girar. */
      @keyframes animateSpin { to { transform: rotate(360deg); } }
      .animate-spin { animation: animateSpin 1s linear infinite; }

      /* La app se escribe con estilos en línea, así que aquí van las únicas
         reglas que dependen del ancho de la pantalla — y por eso llevan
         !important: un estilo en línea gana a una hoja de estilos.

         El problema que resuelven: en la cabecera caben la marca, hasta tres
         píldoras, el nombre y siete botones. En un iPad entra de sobra; en un
         móvil eso mide unos 530 px dentro de una caja de 374, la página
         entera se ensancha, y el engranaje de Ajustes y el botón de salir se
         quedan literalmente fuera de la pantalla. */
      @media (max-width: 620px) {
        /* `env(safe-area-inset-top)` reserva la franja del reloj y la batería.
           Desde el icono de la pantalla de inicio la página empieza en y=0 y
           iOS dibuja la hora ENCIMA, así que la primera fila de la cabecera
           —la marca y las píldoras de gente en línea— quedaba tapada. Es el
           mismo fallo que ya tuvo la barra de aviso con su X.
           En Safari normal la variable vale 0 y `max()` deja los 12 px de
           siempre, así que fuera del icono no cambia nada. */
        .cabecera { padding: max(12px, env(safe-area-inset-top)) 14px 12px !important; }
        /* Ya sabes cómo te llamas, y son los ~110 px que hacen falta para
           que quepan los botones, que son lo que sí hace algo. */
        .cabecera-nombre { display: none !important; }
        .cabecera-marca { gap: 6px !important; }
        .cabecera-iconos { gap: 2px !important; }
        .nav-app { padding-left: 6px !important; padding-right: 6px !important; }
        .nav-app button { padding: 12px 1px !important; font-size: 10px !important; letter-spacing: .03em !important; gap: 6px !important; }
        /* Las cuatro pestañas con su icono no caben, y la que se queda fuera
           ("Mi perfil") no se ve que esté ahí: la barra se desplaza pero no
           lo parece. Sin los iconos entran las cuatro y ya no hay nada
           escondido; el texto solo se lee igual de bien. */
        .nav-app button svg { display: none !important; }
        .main-app { padding: 20px 14px 100px !important; }

        /* Los desplegables (Logros, Ruleta, Frase) van anclados con
           `right: 0` a SU botón. En una pantalla ancha el botón está a la
           derecha y el panel cae hacia dentro; en un móvil los botones se
           han bajado a una segunda fila pegados a la izquierda, así que un
           panel de 320 px colgado de su borde derecho se sale medio metro
           por fuera de la pantalla.

           En vez de inventar un `top` a ojo, se le quita el anclaje al
           botón (los envoltorios pasan a `static`) y el panel se cuelga de
           la fila de iconos entera, de borde a borde. */
        /* Ancho completo: además de dejar los iconos repartidos, es lo que
           da al panel colgado de esta fila el ancho de la pantalla en vez
           del de los siete botones. */
        .cabecera-iconos { position: relative !important; width: 100% !important; justify-content: space-between !important; }
        .cabecera-iconos > div { position: static !important; }
        .desplegable { left: 0 !important; right: 0 !important; width: auto !important; max-width: none !important; }
      }
    </style>

    <script>
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem("pir-ajustes") || "{}");
          var t = a.tema || "sistema";
          var oscuro = t === "oscuro" || (t === "sistema" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-tema", oscuro ? "oscuro" : "claro");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="arranque" class="carga">
        <div class="carga-marca" aria-label="AUTOPIR"><span style="animation-delay:0ms">A</span><span style="animation-delay:70ms">U</span><span style="animation-delay:140ms">T</span><span style="animation-delay:210ms">O</span><span style="animation-delay:280ms">P</span><span style="animation-delay:350ms">I</span><span style="animation-delay:420ms">R</span></div>
        <div class="carga-via"><i></i></div>
        <div class="carga-dice">Preparando tus preguntas</div>
      </div>
    </div>
    <script>
      /* Red de seguridad para la pantalla en blanco.

         El icono de la pantalla de inicio guarda su propia copia de esta
         página. Tras un despliegue, el fichero de JavaScript cambia de
         nombre, así que esa copia apunta a algo que ya no existe: la app no
         arranca y no se ve absolutamente nada, ni un error. Pasó de verdad y
         costó una tarde averiguarlo.

         Si a los 8 segundos React no ha montado, se fuerza UNA recarga con
         un parámetro nuevo (que se salta la copia guardada). Si tras esa
         recarga sigue sin arrancar, se deja un aviso escrito en vez de una
         pantalla vacía. */
      window.__autopirArranco = false;
      setTimeout(function () {
        if (window.__autopirArranco) return;
        var caja = document.getElementById("arranque");
        if (!caja) return;
        var yaRecargado;
        try { yaRecargado = sessionStorage.getItem("autopir-recarga"); } catch (e) { yaRecargado = "1"; }
        if (!yaRecargado) {
          try { sessionStorage.setItem("autopir-recarga", "1"); } catch (e) {}
          var sep = window.location.search ? "&" : "?";
          window.location.replace(window.location.href + sep + "_r=" + Date.now());
          return;
        }
        caja.innerHTML =
          "<strong style='color:#1E1C18;font-size:17px'>No se pudo cargar la aplicación</strong>" +
          "<br><br>Si la abriste desde el icono de la pantalla de inicio, bórralo y vuelve a añadirlo desde Safari." +
          "<br><br>Si no, prueba a recargar dentro de un rato.";
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
