    />
    <style>
      /* Clase de utilidad usada en varios sitios del árbol (Loader2 en el
         login, en "Generar" preguntas IA, en la carga inicial, y en
         "Esperando a un oponente..." del Duelo) — sin este keyframe global
         la clase no hacía nada, así que los iconos de carga se quedaban
         parados en vez de girar. */
      @keyframes animateSpin { to { transform: rotate(360deg); } }
      .animate-spin { animation: animateSpin 1s linear infinite; }
    </style>
